<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container">
<h2>Sản phẩm</h2>
<form method="post" action="/add_product">
<input name="name" class="form-control" placeholder="Tên">
<input name="price" class="form-control mt-2" placeholder="Giá">
<button class="btn btn-primary mt-2">Thêm</button>
</form>
<ul>
{% for p in products %}
<li>{{ p[1] }} - {{ p[2] }}</li>
{% endfor %}
</ul>
</div>
